<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel: Windward Sortie</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07111d;
    font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #e6f2ff;
  }
  #scene, #hud {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #scene { z-index: 1; }
  #hud { z-index: 2; cursor: crosshair; touch-action: none; }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Kestrel 3D flight simulation viewport"></canvas>
<canvas id="hud" aria-label="Flight instruments, radar, and mission HUD"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
